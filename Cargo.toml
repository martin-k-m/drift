[package]
name = "drift-tabular"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Diff two tabular datasets: schema changes, added and removed rows, and which fields moved. Zero dependencies."
license = "MIT"
repository = "https://github.com/martin-k-m/drift"
homepage = "https://github.com/martin-k-m/drift"
readme = "README.md"
keywords = ["csv", "diff", "data", "cli", "comparison"]
categories = ["command-line-utilities", "parsing"]

# The binary, the repository and everything a user types stay `drift`. Only the
# registry name differs, because `drift` was taken on crates.io, and so was the
# `drift-diff` this package used to claim: an unrelated git diff pager took it in
# August 2026, which meant `cargo install drift-diff` fetched somebody else's
# tool. `drift-tabular` was free when this was set, and it says what the thing
# diffs, which the old name did not.
[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
# Deliberately empty. A tool that reads two files and compares them should not
# pull a tree you then have to audit, and the CSV parser it needs is a hundred
# lines. Same reasoning as joist.

[profile.release]
opt-level = 3
lto = true
strip = true
