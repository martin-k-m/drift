name: Publish to crates.io

# Publishing happens from a tag, not from a laptop. A release built by CI is
# built from exactly what is in the repository at that tag, which is the thing
# a reader can check; one uploaded by hand is built from whatever happened to
# be in that working tree.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The same three checks CI runs. crates.io does not allow a version to be
      # replaced once published, so a broken release is permanent and the only
      # place to catch it is before the upload.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

      # Fails if the tag and the manifest disagree. Publishing v0.2.0 from a
      # tree that says 0.1.9 puts the wrong number on the registry permanently,
      # and it is exactly the mistake a tag-triggered release invites.
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $tag but Cargo.toml says $manifest"
            exit 1
          fi
          echo "tag and manifest agree on $manifest"

      # crates.io has no equivalent of PyPI's trusted publishing, so this one
      # does need a token: a CARGO_REGISTRY_TOKEN secret, scoped to publishing
      # this crate rather than to the whole account.
      - run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
